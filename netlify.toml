# Netlify configuration for woundeye-ai.com
# Plain static site: no build step, Netlify publishes the repo root.

[build]
  publish = "."
  command = ""

# Domain redirects (www -> woundeye-ai.com) are handled by Netlify domain settings.

# Keep project notes and build sources off the public site
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-term caching for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
